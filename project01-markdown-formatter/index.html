<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build in Public - Markdown Formatter</title>
    <!-- Tailwind CSS CDN for styling without installation lag -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header Area -->
    <header class="border-b border-gray-800 p-4 bg-gray-900 sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center space-between gap-3">
            <span class="text-2xl">🚀</span>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Public Build Formatter</h1>
                <p class="text-xs text-gray-400">Format messy developer updates into professional updates instantly</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="clearBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded transition">Clear All</button>
            <button id="copyBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded transition shadow-md shadow-indigo-900/30">Copy Output</button>
        </div>
    </header>

    <!-- Workspace Layout -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-800">
        
        <!-- Input Block -->
        <div class="p-4 flex flex-col h-full min-h-[300px]">
            <label for="markdownInput" class="block text-sm font-medium text-gray-400 mb-2 uppercase tracking-wider">Messy Raw Update</label>
            <textarea id="markdownInput" class="w-full flex-1 bg-gray-950 border border-gray-800 rounded p-4 font-mono text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none placeholder-gray-600" placeholder="Type or paste your messy technical logs, milestones, or raw ideas here..."></textarea>
        </div>

        <!-- Rendered Output Block -->
        <div class="p-4 flex flex-col h-full min-h-[300px] bg-gray-900/50">
            <label class="block text-sm font-medium text-gray-400 mb-2 uppercase tracking-wider">Structured Markdown Preview</label>
            <div id="markdownPreview" class="w-full flex-1 bg-gray-950 border border-gray-800 rounded p-4 overflow-y-auto text-sm leading-relaxed prose prose-invert max-w-none">
                <span class="text-gray-600 italic">Structured formatting output will render here automatically...</span>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
