<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Build Formatter - Premium UI</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0f19] text-gray-200 min-h-screen flex flex-col font-sans selection:bg-indigo-500/30">

    <!-- Header Area -->
    <header class="border-b border-gray-800/60 px-6 py-4 bg-[#0e1424]/80 backdrop-blur sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center gap-3.5">
            <div class="h-9 w-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <span class="text-lg">🚀</span>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">Public Build Formatter</h1>
                <p class="text-xs text-gray-400/80">Instantly transform raw technical logs into professional updates</p>
            </div>
        </div>
        <div class="flex gap-2.5">
            <button id="clearBtn" class="px-3.5 py-1.5 bg-gray-800/40 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 text-gray-300 text-sm font-medium rounded-lg transition-all duration-200">Clear</button>
            <button id="copyBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-all duration-200 shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 active:scale-[0.98]">Copy Output</button>
        </div>
    </header>

    <!-- Workspace Layout -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 p-6 bg-[#0b0f19]">
        
        <!-- Input Block -->
        <div class="flex flex-col h-full min-h-[350px] bg-[#0e1424] border border-gray-800/60 rounded-xl p-5 shadow-xl transition-all duration-300 focus-within:border-indigo-500/50 focus-within:shadow-indigo-500/5">
            <div class="flex justify-between items-center mb-3">
                <label for="markdownInput" class="block text-xs font-semibold text-indigo-400 uppercase tracking-widest">Messy Raw Update</label>
                <span class="text-[10px] text-gray-500 font-mono">Plain Text</span>
            </div>
            <textarea id="markdownInput" class="w-full flex-1 bg-[#070a13] border border-gray-800/80 rounded-lg p-4 font-mono text-sm text-gray-300 focus:outline-none focus:border-indigo-500/30 resize-none placeholder-gray-600 leading-relaxed" placeholder="Type or paste your messy technical logs, milestones, or raw ideas here..."></textarea>
        </div>

        <!-- Rendered Output Block -->
        <div class="flex flex-col h-full min-h-[350px] bg-[#0e1424] border border-gray-800/60 rounded-xl p-5 shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest">Structured Preview</label>
                <span class="text-[10px] text-emerald-500/80 font-mono flex items-center gap-1">
                    <span class="h-1.5 w-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Rendered
                </span>
            </div>
            <div id="markdownPreview" class="w-full flex-1 bg-[#070a13] border border-gray-800/80 rounded-lg p-4 overflow-y-auto text-sm leading-relaxed max-w-none">
                <span class="text-gray-600 italic">Structured formatting output will render here automatically...</span>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
